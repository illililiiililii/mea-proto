<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="stayle.css">
    <title>프로필 설정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .avatar-upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .avatar-upload-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            background: var(--bg-navi);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .avatar-upload-btn:hover {
            background: var(--border-sub);
            border-color: #007aff;
        }
        .profile-dropdown {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-navi);
            overflow: hidden;
        }
        .profile-dropdown summary {
            list-style: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(148, 163, 184, 0.08);
        }
        .profile-dropdown summary::-webkit-details-marker { display: none; }
        .profile-dropdown summary::after {
            content: '▾';
            font-size: 12px;
            color: var(--text-secondary);
        }
        .profile-dropdown[open] summary::after {
            content: '▴';
        }
        .dropdown-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
        }
        .api-key-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-navi);
        }
        .api-key-section h3 {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
            margin: 0 0 4px 0;
        }
        .api-key-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .api-key-row label {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-secondary);
        }
        .api-key-row input {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-chat-input);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }
        .api-key-row input:focus {
            border-color: #007aff;
        }
        .api-key-hint {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body class="profile-page-body">

    <div class="profile-card">
        <div class="profile-header-bar">
            <button class="profile-btn-back" id="back-btn" type="button" style="padding: 6px 12px; font-size: 13px; flex: initial;">← 돌아가기</button>
            <h2 id="page-title">프로필 설정</h2>
            <button class="theme-toggle-btn" title="테마 변경">🌙</button>
        </div>

        <!-- 프로필 사진 -->
        <div class="profile-avatar-large" id="avatar-display">
            <img id="avatar-img-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=user'">
        </div>

        <!-- 이미지 파일 업로드 -->
        <div class="avatar-upload-area" id="avatar-upload-area">
            <button type="button" class="avatar-upload-btn" id="avatar-upload-btn">사진 업로드 (PNG, JPG, GIF)</button>
            <input type="file" id="avatar-file-input" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none;">
            <span id="avatar-upload-status" style="font-size: 11px; color: var(--text-secondary);"></span>
        </div>

        <!-- 프리셋 (URL 기반) -->
        <div class="avatar-presets" id="avatar-presets">
            <button type="button" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=Robot">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Robot" alt="robot">
            </button>
            <button type="button" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=Cat">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cat" alt="cat">
            </button>
            <button type="button" class="avatar-opt" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Alex">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Alex" alt="alex">
            </button>
            <button type="button" class="avatar-opt" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Emma">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Emma" alt="emma">
            </button>
            <button type="button" class="avatar-opt" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Liam">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Liam" alt="liam">
            </button>
            <button type="button" class="avatar-opt" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Sophia">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Sophia" alt="sophia">
            </button>
        </div>

        <form id="profile-form" style="width: 100%; display: flex; flex-direction: column; gap: 14px;">
            <div class="profile-field-group">
                <label>아이디 (계정)</label>
                <input type="text" id="prof-user-id" readonly style="opacity: 0.7; cursor: not-allowed;">
            </div>

            <div class="profile-field-group">
                <label>닉네임</label>
                <input type="text" id="prof-user-name" placeholder="닉네임을 입력하세요" required>
            </div>

            <div class="profile-field-group">
                <label>상태 메시지</label>
                <textarea id="prof-status-msg" rows="2" placeholder="상태 메시지를 입력하세요"></textarea>
            </div>

            <div id="sns-readonly-section" class="sns-readonly-section" style="display: none;"></div>

            <div class="profile-field-group" id="avatar-url-group">
                <label>프로필 사진 URL (직접 입력)</label>
                <input type="url" id="prof-avatar-url" placeholder="https://example.com/my-photo.png">
            </div>

            <div class="profile-dropdown" id="sns-setting-section" style="display: none;">
                <div class="dropdown-content social-link-box">
                    <div class="profile-field-group">
                        <label>GitHub</label>
                        <input type="url" id="prof-github-url" placeholder="https://github.com/username">
                    </div>
                    <div class="profile-field-group">
                        <label>Notion</label>
                        <input type="url" id="prof-notion-url" placeholder="https://www.notion.so/your-page">
                    </div>
                    <div class="profile-field-group">
                        <label>LinkedIn</label>
                        <input type="url" id="prof-linkedin-url" placeholder="https://linkedin.com/in/username">
                    </div>
                    <div class="profile-field-group">
                        <label>X / Twitter</label>
                        <input type="url" id="prof-x-url" placeholder="https://x.com/username">
                    </div>
                    <div class="profile-field-group">
                        <label>Instagram</label>
                        <input type="url" id="prof-instagram-url" placeholder="https://instagram.com/username">
                    </div>
                    <div class="profile-field-group">
                        <label>Blog</label>
                        <input type="url" id="prof-blog-url" placeholder="https://your-blog.com">
                    </div>
                    <div class="profile-field-group">
                        <label>Portfolio</label>
                        <input type="url" id="prof-portfolio-url" placeholder="https://your-portfolio.com">
                    </div>
                </div>
            </div>

            <details class="profile-dropdown" id="password-setting-section" open>
                <summary>비밀번호 변경</summary>
                <div class="dropdown-content">
                    <div class="profile-field-group">
                        <label>현재 비밀번호</label>
                        <input type="password" id="prof-current-password" placeholder="현재 비밀번호 입력">
                    </div>
                    <div class="profile-field-group">
                        <label>새 비밀번호</label>
                        <input type="password" id="prof-new-password" placeholder="8자 이상 새 비밀번호">
                    </div>
                    <button type="button" class="profile-btn-save" id="change-password-btn" style="margin-top: 4px;">비밀번호 변경</button>
                </div>
            </details>

            <details class="profile-dropdown" id="ai-settings-section" open>
                <summary>AI API 설정</summary>
                <div class="dropdown-content">
                    <p class="api-key-hint">API 키를 등록하면 채팅에서 @gemini @chatgpt @claude @grok 으로 AI를 호출할 수 있습니다. 미등록 시 해당 AI를 사용할 수 없습니다.</p>

                    <div class="profile-field-group">
                        <label>기본 AI 모델</label>
                        <select id="prof-ai-provider">
                            <option value="gemini">Google Gemini</option>
                            <option value="openai">OpenAI (ChatGPT)</option>
                            <option value="claude">Anthropic (Claude)</option>
                            <option value="grok">xAI (Grok)</option>
                        </select>
                    </div>

                    <div class="api-key-row">
                        <label>Google Gemini API Key</label>
                        <input type="password" id="prof-gemini-key" placeholder="Gemini API 키 입력">
                    </div>
                    <div class="api-key-row">
                        <label>OpenAI (ChatGPT) API Key</label>
                        <input type="password" id="prof-openai-key" placeholder="OpenAI API 키 입력">
                    </div>
                    <div class="api-key-row">
                        <label>Anthropic (Claude) API Key</label>
                        <input type="password" id="prof-claude-key" placeholder="Claude API 키 입력">
                    </div>
                    <div class="api-key-row">
                        <label>xAI (Grok) API Key</label>
                        <input type="password" id="prof-grok-key" placeholder="Grok API 키 입력">
                    </div>
                </div>
            </details>

            <div class="profile-actions">
                <button type="button" class="profile-btn-back" id="profile-edit-toggle" style="display: none;">✏️ 수정</button>
                <button type="submit" class="profile-btn-save" id="save-btn" style="display: none;">프로필 저장</button>
                <button type="button" class="profile-btn-chat" id="chat-btn" style="display: none;">1:1 채팅하기</button>
            </div>
        </form>
    </div>

    <!-- 알림 모달 -->
    <div class="modal-overlay" id="custom-alert-modal">
        <div class="select-ui">
            <div class="select-inbox" id="alert-msg-text">알림 내용</div>
            <div class="btn-box">
                <button type="button" class="btn-y" id="alert-ok-btn">확인</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:5000";
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('id');
        const myUserId = sessionStorage.getItem('myUserId') || "";

        const viewUserId = targetUserId || myUserId;
        const isMyProfile = (!targetUserId || targetUserId === myUserId);

        const pageTitle = document.getElementById('page-title');
        const avatarImgPreview = document.getElementById('avatar-img-preview');
        const avatarPresets = document.getElementById('avatar-presets');
        const avatarUploadArea = document.getElementById('avatar-upload-area');
        const avatarUploadBtn = document.getElementById('avatar-upload-btn');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const avatarUploadStatus = document.getElementById('avatar-upload-status');

        const profUserId = document.getElementById('prof-user-id');
        const profUserName = document.getElementById('prof-user-name');
        const profStatusMsg = document.getElementById('prof-status-msg');
        const profAvatarUrl = document.getElementById('prof-avatar-url');
        const profCurrentPassword = document.getElementById('prof-current-password');
        const profNewPassword = document.getElementById('prof-new-password');
        const profGithubUrl = document.getElementById('prof-github-url');
        const profNotionUrl = document.getElementById('prof-notion-url');
        const profLinkedinUrl = document.getElementById('prof-linkedin-url');
        const profXUrl = document.getElementById('prof-x-url');
        const profInstagramUrl = document.getElementById('prof-instagram-url');
        const profBlogUrl = document.getElementById('prof-blog-url');
        const profPortfolioUrl = document.getElementById('prof-portfolio-url');
        const profAiProvider = document.getElementById('prof-ai-provider');
        const profGeminiKey = document.getElementById('prof-gemini-key');
        const profOpenaiKey = document.getElementById('prof-openai-key');
        const profClaudeKey = document.getElementById('prof-claude-key');
        const profGrokKey = document.getElementById('prof-grok-key');

        const avatarUrlGroup = document.getElementById('avatar-url-group');
        const snsReadonlySection = document.getElementById('sns-readonly-section');
        const snsSettingSection = document.getElementById('sns-setting-section');
        const aiSettingsSection = document.getElementById('ai-settings-section');
        const passwordSettingSection = document.getElementById('password-setting-section');
        const saveBtn = document.getElementById('save-btn');
        const profileEditToggle = document.getElementById('profile-edit-toggle');
        const changePasswordBtn = document.getElementById('change-password-btn');
        const chatBtn = document.getElementById('chat-btn');
        const backBtn = document.getElementById('back-btn');
        const avatarOpts = document.querySelectorAll('.avatar-opt');

        const alertModal = document.getElementById('custom-alert-modal');
        const alertMsgText = document.getElementById('alert-msg-text');
        const alertOkBtn = document.getElementById('alert-ok-btn');

        function showCustomAlert(msg, onConfirm = null) {
            alertMsgText.textContent = msg;
            alertModal.classList.add('show');
            alertOkBtn.onclick = () => {
                alertModal.classList.remove('show');
                if (onConfirm) onConfirm();
            };
        }

        let selectedAvatarUrl = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + (viewUserId || 'user');

        backBtn.onclick = () => window.location.href = 'index.html';

        if (!viewUserId) {
            showCustomAlert('로그인이 필요합니다.', () => window.location.href = 'index.html');
        }

        // 이미지 파일 업로드
        avatarUploadBtn.onclick = () => avatarFileInput.click();

        avatarFileInput.onchange = async () => {
            const file = avatarFileInput.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showCustomAlert('이미지 크기는 5MB 이하여야 합니다.');
                return;
            }

            avatarUploadStatus.textContent = '업로드 중...';

            const formData = new FormData();
            formData.append('avatar', file);

            try {
                const res = await fetch(`${BACKEND_URL}/api/avatar/upload`, { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    selectedAvatarUrl = BACKEND_URL + data.avatarUrl;
                    profAvatarUrl.value = selectedAvatarUrl;
                    avatarImgPreview.src = selectedAvatarUrl;
                    avatarUploadStatus.textContent = '업로드 완료!';
                    avatarOpts.forEach(o => o.classList.remove('selected'));
                } else {
                    showCustomAlert(data.message || '업로드 실패');
                    avatarUploadStatus.textContent = '';
                }
            } catch (err) {
                showCustomAlert('업로드 중 오류 발생');
                avatarUploadStatus.textContent = '';
            }
        };

        // 프리셋 클릭
        avatarOpts.forEach(opt => {
            opt.onclick = () => {
                if (!isMyProfile) return;
                avatarOpts.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedAvatarUrl = opt.getAttribute('data-url');
                profAvatarUrl.value = selectedAvatarUrl;
                avatarImgPreview.src = selectedAvatarUrl;
                avatarUploadStatus.textContent = '';
            };
        });

        // URL 직접 입력
        profAvatarUrl.oninput = () => {
            selectedAvatarUrl = profAvatarUrl.value.trim() || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + viewUserId;
            avatarImgPreview.src = selectedAvatarUrl;
        };

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderSocialLinksForView(data) {
            if (!snsReadonlySection) return;
            snsReadonlySection.innerHTML = '';
            snsReadonlySection.style.display = 'none';

            const normalizeUrl = (value) => {
                const text = String(value || '').trim();
                if (!text) return '';
                const url = /^https?:\/\//i.test(text) ? text : `https://${text}`;
                try {
                    const parsed = new URL(url);
                    return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
                } catch (error) {
                    return '';
                }
            };

            const iconMap = {
                githubUrl: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.06c-3.34.73-4.04-1.6-4.04-1.6-.54-1.38-1.34-1.75-1.34-1.75-1.1-.75.08-.74.08-.74 1.22.09 1.87 1.25 1.87 1.25 1.08 1.85 2.83 1.32 3.52 1 .11-.8.42-1.32.76-1.63-2.66-.3-5.47-1.33-5.47-5.92 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23A11.5 11.5 0 0 1 12 7.17c1.02 0 2.04.14 2.99.41 2.28-1.55 3.29-1.23 3.29-1.23.66 1.65.24 2.87.12 3.17.78.84 1.24 1.91 1.24 3.22 0 4.6-2.82 5.61-5.5 5.91.43.37.82 1.09.82 2.2v3.26c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/></svg>',
                notionUrl: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="6" fill="currentColor" opacity="0.12"></rect><path fill="currentColor" d="M9 8h6.8l7.1 7.3V24a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2zm1.5 3.6v11.8h12.5v-8.2l-4.8-4.8H10.5zm3.4 2.9h2.2v7.3h-2.2v-7.3zm5.6-1.8h2.2v9.1h-2.2V12.7z"/></svg>',
                linkedinUrl: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"></rect><path fill="#fff" d="M8 9.5h2.4v7H8v-7zm1.2-3.2a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM11.8 9.5h2.3v1h.1c.3-.6 1.1-1.2 2.3-1.2 2.4 0 2.8 1.6 2.8 3.6v3.6h-2.4v-3.3c0-1.1 0-2.4-1.5-2.4s-1.7 1.2-1.7 2.3v3.4h-2.4v-7z"/></svg>',
                xUrl: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H21l-6.8 7.8L22.2 22h-6.1l-4.8-7.1L6.1 22H4l7.3-8.4L1.8 2h6.3l4.4 6.5L18.9 2Zm-1.1 18h1.7L7.2 3.9H5.4L17.8 20Z"/></svg>',
                instagramUrl: '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ig-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#feda75"/><stop offset="35%" stop-color="#fa7e1e"/><stop offset="70%" stop-color="#d62976"/><stop offset="100%" stop-color="#4f5bd5"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="url(#ig-gradient)"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.2" fill="#fff"/></svg>',
                blogUrl: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 2a8 8 0 0 1 6.7 13.3l-1.2-1.2A6.5 6.5 0 0 0 12 6.5a6.5 6.5 0 0 0-5.5 3.3L5.3 8.6A8 8 0 0 1 12 4Zm-6.3 9.2a6.7 6.7 0 0 0 12.6 0H18a8 8 0 0 1-12 0h-.3Zm5.4 2.5h1.8v1.8h-1.8zm3.8 0h1.8v1.8h-1.8z"/></svg>',
                portfolioUrl: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9zm2.5-.5a.5.5 0 0 0-.5.5v9c0 .3.2.5.5.5h11a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-11zm1.6 3.4h7.8v1.8H8.1v-1.8zm0 3.4h5.4v1.8H8.1v-1.8z"/></svg>'
            };
            const links = [
                { key: 'githubUrl', label: 'GitHub', url: data.githubUrl },
                { key: 'notionUrl', label: 'Notion', url: data.notionUrl },
                { key: 'linkedinUrl', label: 'LinkedIn', url: data.linkedinUrl },
                { key: 'xUrl', label: 'X', url: data.xUrl },
                { key: 'instagramUrl', label: 'Instagram', url: data.instagramUrl },
                { key: 'blogUrl', label: 'Blog', url: data.blogUrl },
                { key: 'portfolioUrl', label: 'Portfolio', url: data.portfolioUrl }
            ].map(item => ({ ...item, url: normalizeUrl(item.url) })).filter(item => item.url).map(item => ({ ...item, iconSvg: iconMap[item.key] || '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.4 3.1h3.2v7.2h7.2v3.2h-7.2v7.2h-3.2v-7.2H3.2v-3.2h7.2V3.1z"/></svg>' }));

            if (links.length === 0) {
                snsReadonlySection.style.display = 'none';
                return;
            }

            snsReadonlySection.innerHTML = `
                <div class="sns-readonly-row">
                    ${links.map(item => {
                        const safeUrl = escapeHtml(item.url);
                        const safeTitle = escapeHtml(item.label);
                        return `
                            <a class="sns-icon-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="${safeTitle}" aria-label="${safeTitle}">
                                <span class="sns-icon">${item.iconSvg}</span>
                            </a>
                        `;
                    }).join('')}
                </div>
            `;
            snsReadonlySection.style.display = 'flex';
        }

        function setProfileEditing(enabled) {
            const inputs = [
                profUserName,
                profStatusMsg,
                profAvatarUrl,
                profGithubUrl,
                profNotionUrl,
                profLinkedinUrl,
                profXUrl,
                profInstagramUrl,
                profBlogUrl,
                profPortfolioUrl,
                profAiProvider,
                profGeminiKey,
                profOpenaiKey,
                profClaudeKey,
                profGrokKey,
                profCurrentPassword,
                profNewPassword
            ].filter(Boolean);

            inputs.forEach((input) => {
                if (input.tagName === 'SELECT' || input.tagName === 'INPUT' || input.tagName === 'TEXTAREA') {
                    input.disabled = !enabled;
                    input.readOnly = !enabled && input.tagName !== 'SELECT';
                }
            });

            if (saveBtn) {
                saveBtn.style.display = enabled ? 'inline-block' : 'none';
            }
            if (profileEditToggle) {
                profileEditToggle.textContent = enabled ? '취소' : '✏️ 수정';
                profileEditToggle.style.display = isMyProfile ? 'inline-block' : 'none';
            }

            if (avatarPresets) avatarPresets.style.display = enabled ? 'flex' : 'none';
            if (avatarUploadArea) avatarUploadArea.style.display = enabled ? 'flex' : 'none';
            if (avatarUrlGroup) avatarUrlGroup.style.display = enabled ? 'flex' : 'none';
            if (snsSettingSection) snsSettingSection.style.display = enabled ? 'block' : 'none';
            if (aiSettingsSection) aiSettingsSection.style.display = enabled ? 'block' : 'none';
            if (passwordSettingSection) passwordSettingSection.style.display = enabled ? 'block' : 'none';
            if (profUserName) profUserName.style.opacity = enabled ? '1' : '0.8';
            if (profStatusMsg) profStatusMsg.style.opacity = enabled ? '1' : '0.8';
        }

        // 프로필 로드
        async function loadProfile() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/profile/${viewUserId}`);
                const data = await res.json();

                if (data.success) {
                    profUserId.value = data.userId;
                    profUserName.value = data.userName;
                    profStatusMsg.value = data.statusMsg || "";
                    selectedAvatarUrl = data.avatar || ('https://api.dicebear.com/7.x/bottts/svg?seed=' + data.userId);
                    profAvatarUrl.value = selectedAvatarUrl;
                    avatarImgPreview.src = selectedAvatarUrl;

                    if (profAiProvider) profAiProvider.value = data.aiProvider || "gemini";
                    if (profGeminiKey) profGeminiKey.value = data.geminiKey || "";
                    if (profOpenaiKey) profOpenaiKey.value = data.openaiKey || "";
                    if (profClaudeKey) profClaudeKey.value = data.claudeKey || "";
                    if (profGrokKey) profGrokKey.value = data.grokKey || "";
                    if (profGithubUrl) profGithubUrl.value = data.githubUrl || "";
                    if (profNotionUrl) profNotionUrl.value = data.notionUrl || "";
                    if (profLinkedinUrl) profLinkedinUrl.value = data.linkedinUrl || "";
                    if (profXUrl) profXUrl.value = data.xUrl || "";
                    if (profInstagramUrl) profInstagramUrl.value = data.instagramUrl || "";
                    if (profBlogUrl) profBlogUrl.value = data.blogUrl || "";
                    if (profPortfolioUrl) profPortfolioUrl.value = data.portfolioUrl || "";

                    renderSocialLinksForView(data);

                    avatarOpts.forEach(opt => {
                        if (opt.getAttribute('data-url') === selectedAvatarUrl) {
                            opt.classList.add('selected');
                        }
                    });
                } else {
                    showCustomAlert('프로필을 불러올 수 없습니다.');
                }
            } catch (err) {
                console.error(err);
            }

            if (!isMyProfile) {
                pageTitle.textContent = "유저 프로필";
                profUserName.readOnly = true;
                profStatusMsg.readOnly = true;
                profUserName.style.opacity = '0.8';
                profStatusMsg.style.opacity = '0.8';
                avatarPresets.style.display = 'none';
                avatarUploadArea.style.display = 'none';
                if (avatarUrlGroup) avatarUrlGroup.style.display = 'none';
                if (aiSettingsSection) aiSettingsSection.style.display = 'none';
                if (passwordSettingSection) passwordSettingSection.style.display = 'none';
                const snsSettingSection = document.getElementById('sns-setting-section');
                if (snsSettingSection) snsSettingSection.style.display = 'none';
                saveBtn.style.display = 'none';
                chatBtn.style.display = 'block';
                chatBtn.onclick = () => window.location.href = `index.html?chat=${viewUserId}`;
            } else {
                setProfileEditing(false);
                renderSocialLinksForView({
                    githubUrl: profGithubUrl ? profGithubUrl.value : '',
                    notionUrl: profNotionUrl ? profNotionUrl.value : '',
                    linkedinUrl: profLinkedinUrl ? profLinkedinUrl.value : '',
                    xUrl: profXUrl ? profXUrl.value : '',
                    instagramUrl: profInstagramUrl ? profInstagramUrl.value : '',
                    blogUrl: profBlogUrl ? profBlogUrl.value : '',
                    portfolioUrl: profPortfolioUrl ? profPortfolioUrl.value : ''
                });
                if (profileEditToggle) {
                    profileEditToggle.onclick = () => {
                        const next = profileEditToggle.textContent !== '취소';
                        setProfileEditing(next);
                    };
                }
            }
        }

        changePasswordBtn.onclick = async () => {
            const currentPassword = profCurrentPassword ? profCurrentPassword.value.trim() : '';
            const newPassword = profNewPassword ? profNewPassword.value.trim() : '';
            if (!newPassword || newPassword.length < 8) {
                showCustomAlert('새 비밀번호는 8자 이상이어야 합니다.');
                return;
            }
            try {
                const res = await fetch(`${BACKEND_URL}/api/profile/password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: myUserId, currentPassword, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    showCustomAlert('비밀번호가 변경되었습니다.', () => {
                        if (profCurrentPassword) profCurrentPassword.value = '';
                        if (profNewPassword) profNewPassword.value = '';
                    });
                } else {
                    showCustomAlert(data.message || '비밀번호 변경에 실패했습니다.');
                }
            } catch (err) {
                showCustomAlert('서버 연결 실패');
            }
        };

        loadProfile();

        // 프로필 저장
        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!isMyProfile) return;

            const userName = profUserName.value.trim();
            const statusMsg = profStatusMsg.value.trim();
            const avatarUrl = profAvatarUrl.value.trim() || selectedAvatarUrl;
            const aiProvider = profAiProvider ? profAiProvider.value : "gemini";
            const geminiKey = profGeminiKey ? profGeminiKey.value.trim() : "";
            const openaiKey = profOpenaiKey ? profOpenaiKey.value.trim() : "";
            const claudeKey = profClaudeKey ? profClaudeKey.value.trim() : "";
            const grokKey = profGrokKey ? profGrokKey.value.trim() : "";
            const githubUrl = profGithubUrl ? profGithubUrl.value.trim() : "";
            const notionUrl = profNotionUrl ? profNotionUrl.value.trim() : "";
            const linkedinUrl = profLinkedinUrl ? profLinkedinUrl.value.trim() : "";
            const xUrl = profXUrl ? profXUrl.value.trim() : "";
            const instagramUrl = profInstagramUrl ? profInstagramUrl.value.trim() : "";
            const blogUrl = profBlogUrl ? profBlogUrl.value.trim() : "";
            const portfolioUrl = profPortfolioUrl ? profPortfolioUrl.value.trim() : "";

            if (!userName) {
                showCustomAlert('닉네임을 입력해 주세요.');
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/profile/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: myUserId,
                        userName,
                        statusMsg,
                        avatar: avatarUrl,
                        aiProvider,
                        geminiKey,
                        openaiKey,
                        claudeKey,
                        grokKey,
                        githubUrl,
                        notionUrl,
                        linkedinUrl,
                        xUrl,
                        instagramUrl,
                        blogUrl,
                        portfolioUrl
                    })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('myUserName', userName);
                    sessionStorage.setItem('myStatusMsg', statusMsg);
                    sessionStorage.setItem('myAvatar', avatarUrl);
                    showCustomAlert('프로필이 성공적으로 저장되었습니다!', () => {
                        window.location.href = 'index.html';
                    });
                } else {
                    showCustomAlert(data.message || '저장에 실패했습니다.');
                }
            } catch (err) {
                showCustomAlert('서버 연결 실패');
            }
        };
    </script>
</body>
</html>
