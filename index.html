<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="stayle.css">
    <title>메신저</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        .navi-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 220px;
            border-right: 1px solid var(--border-color);
            background: var(--bg-navi);
            flex-shrink: 0;
            height: 100%;
        }

        .search-bar {
            padding: 10px;
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--border-sub);
            flex-shrink: 0;
        }

        .navi {
            flex: 1;
            overflow-y: auto;
            width: 100%;
        }

        .message-sender-name {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            font-weight: bold;
        }
        
        .incoming .message-sender-name {
            margin-left: 2px;
        }

        textarea.chat-input {
            resize: none;
            height: 36px;
            max-height: 100px;
            padding: 8px 14px;
            line-height: 1.4;
            font-family: inherit;
        }

        .ai-thinking {
            font-style: italic;
            color: var(--text-secondary);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* 알림 배지 */
        .unread-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--my-bubble-bg, #0284c7);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            margin-left: auto;
            flex-shrink: 0;
            animation: badge-pop 0.3s ease;
        }

        @keyframes badge-pop {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 파일 업로드 버튼 */
        .file-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-navi);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .file-upload-btn:hover {
            background: var(--border-sub);
            transform: scale(1.05);
        }

        /* AI 모델 선택 드롭다운 */
        #ai-model-select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-chat-input);
            color: var(--text-primary);
            font-size: 11px;
            outline: none;
            margin-left: auto;
        }

        /* 채팅 파일 이미지 */
        .chat-file-image {
            max-width: 240px;
            max-height: 200px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .chat-file-image:hover {
            transform: scale(1.02);
        }

        .chat-file-link {
            color: var(--my-bubble-text, #0369a1);
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .chat-file-link:hover {
            text-decoration: underline;
        }

        /* AI 봇 버튼 스타일 */
        .ai-bot-btn {
            border-bottom: 2px solid var(--my-bubble-bg, #0284c7) !important;
        }

        /* password container */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .pw-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            width: auto !important;
            height: auto !important;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }
    </style>
</head>
<body>
    
    <!-- 메인 메신저 -->
    <div class="messenger-main is-blurred" id="messenger-main">
        <header class="header">
            <div>
                <menu class="menu">
                    <b style="display: flex; align-items: center; gap: 6px;">메신저</b>
                    <div id="user-profile-summary" style="display: flex; align-items: center; gap: 8px; margin-left: 12px; cursor: pointer;" title="프로필 수정">
                        <span id="user-display-avatar" style="font-size: 20px;"></span>
                        <div style="display: flex; flex-direction: column;">
                            <span id="user-display-name" style="font-size: 13px; font-weight: bold; color: var(--text-primary);"></span>
                            <span id="user-display-status" style="font-size: 11px; color: var(--text-secondary);"></span>
                        </div>
                    </div>
                    <button id="profile-edit-btn" style="padding: 5px 10px; font-size: 12px; background: var(--border-sub); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: bold; margin-left: 8px; transition: all 0.2s ease;">프로필 수정</button>
                    <div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
                        <button id="logout-btn" style="padding: 5px 10px; font-size: 12px; background: #ff3b30; color: white; border: none; border-radius: 8px; cursor: pointer; display: none; font-weight: bold;">로그아웃</button>
                        <button id="theme-toggle" class="theme-toggle-btn" title="테마 변경">🌙</button>
                    </div>
                </menu>
            </div>
        </header>

        <div class="mid">
            <!-- 좌측 사이드바 -->
            <div class="navi-container">
                <div class="search-bar">
                    <input type="text" id="search-input" class="search-input" placeholder="유저 검색..." style="width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; outline: none; background: var(--bg-chat-input); color: var(--text-primary);">
                    <button id="search-btn" class="search-btn" style="padding: 6px 10px; border: none; background: #007aff; color: white; border-radius: 6px; cursor: pointer; font-size: 12px; flex-shrink: 0;">검색</button>
                </div>
                <div class="navi"></div>
            </div>

            <!-- 우측 채팅 영역 -->
            <main class="main1">
                <div class="missing" id="missing">상대를 선택하거나 검색해 주세요.</div>
                
                <div class="chat-screen" id="chat-screen" style="display: none;">
                    <div class="chat-header">
                        <span class="chat-back" id="chat-back" style="cursor: pointer;"><img src="angle-small-left_3916909.png" alt="back"/></span>
                        <div class="chat-header-info">
                            <div class="chat-header-avatar" id="chat-target-avatar"></div>
                            <div class="chat-header-text">
                                <span class="chat-title" id="chat-target-name">대화방</span>
                                <span class="chat-header-status" id="chat-target-status"></span>
                            </div>
                        </div>
                        <select id="ai-model-select" style="display: none;">
                            <option value="gemini">Gemini</option>
                            <option value="openai">ChatGPT</option>
                            <option value="claude">Claude</option>
                            <option value="grok">Grok</option>
                        </select>
                        <button id="view-target-profile-btn" style="padding: 4px 10px; font-size: 11px; background: var(--bg-navi); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: bold;">프로필</button>
                    </div>
                  
                    <div class="chat-body" id="chat-body"></div>
                  
                    <form class="chat-footer" onsubmit="event.preventDefault();">
                      <button type="button" class="file-upload-btn" id="file-upload-btn" title="파일 전송">📎</button>
                      <input type="file" id="file-upload-input" style="display: none;" accept="image/*,.pdf,.txt,.zip,.doc,.docx,.xls,.xlsx,.pptx,.mp4,.mp3">
                      <textarea class="chat-input" id="chat-input" placeholder="메시지를 입력하세요... (Shift+Enter 줄바꿈)"></textarea>
                      <button type="submit" class="send-button" id="send-button">전송</button>
                    </form>
                </div>
            </main>
        </div>
        <footer class="footer"></footer>
    </div>

    <!-- 로그인 모달 -->
    <div class="login-win" id="login-win">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <h2 style="margin: 0; font-size: 20px;">환영합니다</h2>
            <button id="theme-toggle-login" class="theme-toggle-btn" title="테마 변경">🌙</button>
        </div>
        <div class="auth-tabs">
          <button id="tab-login-btn" class="active" type="button">로그인</button>
          <button id="tab-register-btn" type="button">회원가입</button>
        </div>
      
        <!-- 로그인 폼 -->
        <form id="login-form" class="auth-form">
          <input type="text" id="login-id" placeholder="아이디 입력" required>
          <div class="password-container">
            <input type="password" id="login-pw" placeholder="비밀번호 입력">
            <button type="button" id="login-pw-toggle" class="pw-toggle-btn">🙈</button>
          </div>
          <button type="submit">로그인</button>
        </form>
      
        <!-- 회원가입 폼 -->
        <form id="register-form" class="auth-form" style="display: none;">
            <input type="text" id="reg-id" placeholder="아이디 (영문, 숫자 조합 2자 이상)" required>
            <div class="password-container">
                <input type="password" id="reg-pw" placeholder="비밀번호 입력 (8자 이상)">
                <button type="button" id="reg-pw-toggle" class="pw-toggle-btn">🙈</button>
            </div>
            <input type="text" id="reg-name" placeholder="닉네임 (이름)" required>
            <div style="font-size: 11px; color: var(--text-secondary); text-align: left; margin: -4px 0 6px 4px;">
                API 키는 가입 후 [프로필 설정]에서 등록할 수 있습니다.<br>
                미등록 시 AI 기능 사용불가, 일반 채팅/프로필은 자유롭게 이용 가능합니다.
            </div>
            <button type="submit">가입</button>
        </form>
    </div>

    <!-- 로그아웃 모달 -->
    <div class="modal-overlay" id="logout-modal">
        <div class="select-ui">
            <h2 class="select-inbox">로그아웃 하시겠습니까?</h2>
            <div class="btn-box">
                <button class="btn-y" id="confirm-logout-btn" type="button">YES</button>
                <button class="btn-n" id="cancel-logout-btn" type="button">NO</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
